name: Build Shree Ganesh V9 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project.zip
        run: |
          if [ ! -f project.zip ]; then
            echo "ERROR: project.zip is missing. Upload project.zip to the repository."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project
        run: unzip -q project.zip -d src_build

      - name: Build debug APK
        working-directory: src_build
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shree-Ganesh-V9-debug-APK
          path: src_build/app/build/outputs/apk/debug/*.apk
