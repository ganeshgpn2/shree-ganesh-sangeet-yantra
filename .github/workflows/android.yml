
name: Build Shree Ganesh Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp Shree_Ganesh_Sangeet_Yantra_V8.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shreeganesh.sangeet",
            "appName": "Shree Ganesh Sangeet Yantra",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shree-Ganesh-Sangeet-Yantra-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
